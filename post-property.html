<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Post Property | RealtyAdda</title>
<meta name="description"
content="Post your property for sale or rent on RealtyAdda. For owners, agents and builders across Delhi NCR and Meerut.">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f3f6fb;
  color: #182338;
  line-height: 1.5;
}

header {
  background: #ffffff;
  border-bottom: 1px solid #e1e7ef;
  padding: 18px 6%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 16px;
}

.logo {
  color: #1458bb;
  font-size: 25px;
  font-weight: bold;
  text-decoration: none;
}

nav {
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
}

nav a {
  color: #27364d;
  text-decoration: none;
  font-weight: bold;
}

nav a:hover {
  color: #1458bb;
}

main {
  max-width: 860px;
  margin: 32px auto;
  padding: 0 16px;
}

.card {
  background: #ffffff;
  padding: 28px;
  border-radius: 16px;
  box-shadow: 0 8px 30px rgba(22, 53, 91, 0.06);
}

h1 {
  margin: 0 0 8px;
}

.intro {
  margin: 0 0 26px;
  color: #53627a;
}

fieldset {
  margin: 0;
  padding: 0;
  border: 0;
  min-width: 0;
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}

.full {
  grid-column: 1 / -1;
}

label {
  display: block;
  font-weight: bold;
  margin-bottom: 7px;
}

input,
select,
textarea {
  display: block;
  width: 100%;
  padding: 12px;
  border: 1px solid #b9c5d6;
  border-radius: 8px;
  font: inherit;
  background: #ffffff;
  color: #182338;
}

input:focus,
select:focus,
textarea:focus {
  outline: 3px solid #dbeafe;
  border-color: #1458bb;
}

textarea {
  min-height: 120px;
  resize: vertical;
}

.hint {
  display: block;
  color: #59677c;
  font-size: 13px;
  margin-top: 5px;
}

button {
  width: 100%;
  padding: 15px;
  margin-top: 24px;
  border: 0;
  border-radius: 9px;
  background: #1458bb;
  color: #ffffff;
  font: inherit;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #104a9e;
}

button:disabled {
  opacity: 0.65;
  cursor: wait;
}

#message {
  margin-top: 20px;
  padding: 15px;
  border-radius: 9px;
  white-space: pre-line;
  overflow-wrap: anywhere;
}

#message:empty {
  display: none;
}

#message.info {
  background: #eaf2ff;
  color: #16488c;
}

#message.success {
  background: #e5f7ec;
  color: #17623a;
}

#message.error {
  background: #fff0e8;
  color: #8a350b;
}

footer {
  text-align: center;
  color: #627087;
  padding: 24px 16px;
}

@media (max-width: 600px) {
  .grid {
    grid-template-columns: 1fr;
  }

  .card {
    padding: 20px;
  }

  h1 {
    font-size: 27px;
  }
}
</style>
</head>

<body>

<header>
  <a class="logo" href="index.html">RealtyAdda</a>

  <nav aria-label="Main navigation">
    <a href="index.html">Home</a>
    <a href="buy.html">Buy</a>
    <a href="rent.html">Rent</a>
    <a href="projects.html">Projects</a>
  </nav>
</header>

<main>
  <div class="card">
    <h1>Post your property</h1>

    <p class="intro">
      Share your property details for sale or rent.
      Fields marked * are required.
    </p>

    <form id="propertyForm">
      <fieldset id="fields">
        <div class="grid">

          <div>
            <label for="purpose">I want to *</label>
            <select id="purpose" name="purpose" required>
              <option value="">Select Sale or Rent</option>
              <option value="Sale">Sell my property</option>
              <option value="Rent">Rent out my property</option>
            </select>
          </div>

          <div>
            <label for="postedBy">Posted by *</label>
            <select id="postedBy" name="postedBy" required>
              <option value="">Select Owner, Agent or Builder</option>
              <option value="Owner">Owner</option>
              <option value="Agent">Agent</option>
              <option value="Builder">Builder</option>
            </select>
          </div>

          <div>
            <label for="name">Full name *</label>
            <input
              id="name"
              name="name"
              type="text"
              autocomplete="name"
              maxlength="100"
              required>
          </div>

          <div>
            <label for="mobile">Mobile number *</label>
            <input
              id="mobile"
              name="mobile"
              type="tel"
              inputmode="numeric"
              autocomplete="tel-national"
              pattern="[6-9][0-9]{9}"
              minlength="10"
              maxlength="10"
              title="Enter a 10-digit Indian mobile number without +91"
              placeholder="10-digit mobile number"
              required>
          </div>

          <div>
            <label for="city">City *</label>
            <select id="city" name="city" required>
              <option value="">Select city</option>
              <option>Noida</option>
              <option>Greater Noida</option>
              <option>Greater Noida West</option>
              <option>Ghaziabad</option>
              <option>Delhi</option>
              <option>Meerut</option>
              <option>Yamuna Expressway</option>
              <option>Gurugram</option>
              <option>Faridabad</option>
              <option>Other NCR</option>
            </select>
          </div>

          <div>
            <label for="locality">Locality / Society *</label>
            <input
              id="locality"
              name="locality"
              type="text"
              placeholder="Society, sector or area"
              maxlength="200"
              required>
          </div>

          <div>
            <label for="propertyType">Property type *</label>
            <select id="propertyType" name="propertyType" required>
              <option value="">Select property type</option>
              <option>Apartment / Flat</option>
              <option>Independent House</option>
              <option>Villa</option>
              <option>Builder Floor</option>
              <option>Residential Plot</option>
              <option>Shop / Showroom</option>
              <option>Office</option>
              <option>Commercial Land</option>
              <option>Warehouse</option>
              <option>Other</option>
            </select>
          </div>

          <div>
            <label for="bhk">BHK</label>
            <select id="bhk" name="bhk">
              <option value="">Select if applicable</option>
              <option>Studio</option>
              <option>1 BHK</option>
              <option>2 BHK</option>
              <option>3 BHK</option>
              <option>4 BHK</option>
              <option>5+ BHK</option>
              <option>Not Applicable</option>
            </select>
          </div>

          <div>
            <label for="area">Area in sq ft</label>
            <input
              id="area"
              name="area"
              type="number"
              min="1"
              step="any"
              placeholder="Example: 1450">
          </div>

          <div>
            <label id="priceLabel" for="price">
              Expected price (₹) *
            </label>
            <input
              id="price"
              name="price"
              type="number"
              min="1"
              step="1"
              placeholder="Example: 8000000"
              required>
            <span class="hint">
              Enter the full amount in rupees.
            </span>
          </div>

          <div class="full">
            <label for="description">Property description</label>
            <textarea
              id="description"
              name="description"
              maxlength="3000"
              placeholder="Floor, furnishing, parking, availability and other details"></textarea>
          </div>

        </div>
      </fieldset>

      <button id="submitButton" type="submit" disabled>
        Submit property
      </button>

      <div id="message" role="status" aria-live="polite"></div>
    </form>

    <noscript>
      Please enable JavaScript in your browser to submit this form.
    </noscript>
  </div>
</main>

<footer>
  RealtyAdda · Property in Delhi NCR &amp; Meerut
</footer>

<script>
"use strict";

const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx5bibvXrCBKZ9LsSdIHEaLD5u7UH5m4FPf7IH9nOijFNlEOPVYbFVH-AZu9oxLyT6u/exec";

const form = document.getElementById("propertyForm");
const fields = document.getElementById("fields");
const button = document.getElementById("submitButton");
const message = document.getElementById("message");
const purpose = document.getElementById("purpose");
const price = document.getElementById("price");

let busy = false;
let retryId = "";
let retryPayload = "";

function showMessage(text, type) {
  message.textContent = text;
  message.className = type;
}

function updatePriceLabel() {
  const renting = purpose.value === "Rent";

  document.getElementById("priceLabel").textContent = renting
    ? "Expected monthly rent (₹) *"
    : "Expected price (₹) *";

  price.placeholder = renting
    ? "Example: 22000"
    : "Example: 8000000";
}

purpose.addEventListener("change", updatePriceLabel);

function newSubmissionId() {
  if (
    window.crypto &&
    typeof window.crypto.randomUUID === "function"
  ) {
    return window.crypto.randomUUID();
  }

  return "ra-" + Date.now() + "-" +
    Math.random().toString(36).slice(2);
}

function checkSaved(id) {
  return new Promise(function(resolve, reject) {
    const callback = "ra_" + Date.now() + "_" +
      Math.random().toString(36).slice(2);

    const script = document.createElement("script");
    let timer;

    function cleanup() {
      clearTimeout(timer);
      script.remove();

      window[callback] = function() {};

      setTimeout(function() {
        delete window[callback];
      }, 60000);
    }

    window[callback] = function(data) {
      cleanup();
      resolve(data);
    };

    script.onerror = function() {
      cleanup();
      reject(new Error("Could not verify submission."));
    };

    const url = new URL(SCRIPT_URL);
    url.searchParams.set("action", "status");
    url.searchParams.set("submissionId", id);
    url.searchParams.set("callback", callback);
    url.searchParams.set("_", Date.now());

    timer = setTimeout(function() {
      cleanup();
      reject(new Error("Verification timed out."));
    }, 10000);

    script.src = url.toString();
    document.head.appendChild(script);
  });
}

function pause(ms) {
  return new Promise(function(resolve) {
    setTimeout(resolve, ms);
  });
}

form.addEventListener("submit", async function(event) {
  event.preventDefault();

  if (busy || !form.reportValidity()) {
    return;
  }

  const params = new URLSearchParams();

  for (const [key, value] of new FormData(form).entries()) {
    params.append(key, String(value).trim());
  }

  if (!params.get("name") || !params.get("locality")) {
    showMessage(
      "Please enter your name and locality.",
      "error"
    );
    return;
  }

  const payload = params.toString();

  // Reuse the submission ID when retrying unchanged details.
  if (!retryId || payload !== retryPayload) {
    retryId = newSubmissionId();
    retryPayload = payload;
  }

  const id = retryId;
  params.set("submissionId", id);

  busy = true;
  fields.disabled = true;
  button.disabled = true;
  button.textContent = "Submitting...";

  showMessage(
    "Sending your details. Please keep this page open.",
    "info"
  );

  try {
    const controller = new AbortController();

    const timer = setTimeout(function() {
      controller.abort();
    }, 15000);

    try {
      await fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        credentials: "omit",
        body: params,
        signal: controller.signal
      });
    } catch (error) {
      // Verify the sheet even if the POST response is unavailable.
    } finally {
      clearTimeout(timer);
    }

    showMessage(
      "Checking that your entry was saved in Google Sheets...",
      "info"
    );

    let saved = false;

    for (let attempt = 0; attempt < 5; attempt++) {
      try {
        const result = await checkSaved(id);

        if (result.status === "saved") {
          saved = true;
          break;
        }
      } catch (error) {
        // Retry temporary connection failures.
      }

      if (attempt < 4) {
        await pause(1500);
      }
    }

    if (!saved) {
      throw new Error(
        "We could not confirm saving. Your details have been kept here. " +
        "Please retry. If this continues, check the Apps Script deployment " +
        "uses the new version and allows access to Anyone."
      );
    }

    form.reset();
    updatePriceLabel();

    retryId = "";
    retryPayload = "";

    showMessage(
      "Property submitted successfully!\n" +
      "Your details have been saved for review.\n" +
      "Reference: " + id,
      "success"
    );

    window.alert(
      "Property submitted successfully! Your details have been saved."
    );
  } catch (error) {
    showMessage(
      error.message || "Please try again.",
      "error"
    );
  } finally {
    busy = false;
    fields.disabled = false;
    button.disabled = false;
    button.textContent = "Submit property";
  }
});

button.disabled = false;
</script>

</body>
</html>
